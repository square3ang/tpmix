name: AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # oldest runner whose g++ has std::format (gcc 13) and Qt 6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config qt6-base-dev qmake6 qt6-wayland \
            libhidapi-dev libfuse2t64 file

      - name: Build AppImage
        run: packaging/appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tpmix-AppImage
          path: tpmix-*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tpmix-*.AppImage
